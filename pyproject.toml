[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dicomutils"
version = "0.1.0"
maintainers = [
  {name = "pangyuteng", email = "pangyuteng@github"}
]
description = "dicom utils"
readme = "README.md"
requires-python = ">= 3.10"

[tool.setuptools]
include-package-data = false

[tool.hatch.build.targets.wheel]
packages = ["src/dicomutils"]

[project.urls]
Repository = "https://github.com/pangyuteng/dicomutils"
